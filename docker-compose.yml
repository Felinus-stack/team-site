version: '3.8'

services:
  # MySQL 数据库服务
  db:
    image: mysql:8.0
    container_name: team-site-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: team_site
      MYSQL_USER: team_user
      MYSQL_PASSWORD: team_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - team-site-network

  # Next.js 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: team-site-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://team_user:team_password@db:3306/team_site
      - NEXTAUTH_SECRET=your-nextauth-secret-here
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=your-google-maps-api-key
    depends_on:
      - db
    networks:
      - team-site-network
    volumes:
      - ./prisma:/app/prisma

volumes:
  mysql_data:

networks:
  team-site-network:
    driver: bridge